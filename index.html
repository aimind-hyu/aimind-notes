<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미팅 노트 대시보드 — AiMIND Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<script>
// ============================================================
// 1) EDIT THESE THREE VALUES
// ============================================================
const CONFIG = {
  CLIENT_ID: "50562912255-o4mr2m7hgr8v5gd7fejo8r7ltjt94oqb.apps.googleusercontent.com", // from Google Cloud Console
  SPREADSHEET_ID: "1vsJOK2bJ4lNfPHWbVSq8KcLz--7Lmvl2Rg5kG1k1_W8", // from the sheet's URL
  SHEET_RANGE: "A:Z",                                            // usually fine as-is
  ALLOWED_DOMAIN: "hanyang.ac.kr"                                // school domain
};
</script>

<style>
  :root {
    --paper: #FFFFFF;
    --paper-line: #E0E0E0;
    --ink: #202124;
    --ink-soft: #5F6368;
    --blue: #1A73E8;
    --blue-dark: #174EA6;
    --bg-tint: #F8F9FA;
    --red: #D93025;
    --red-bg: #FCE8E6;
    font-family: "Roboto", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-tint);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--blue); }

  /* ---------- Top bar ---------- */
  .topbar {
    background: #fff;
    border-bottom: 1px solid var(--paper-line);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .topbar h1 {
    font-size: 18px;
    font-weight: 500;
    margin: 0;
  }
  .user-box {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .user-box img { width: 28px; height: 28px; border-radius: 50%; }
  .btn {
    font-size: 13px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 4px;
    border: 1px solid var(--paper-line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  .btn:hover { border-color: var(--blue); color: var(--blue); }
  .btn-primary {
    background: var(--blue);
    color: #fff;
    border: none;
  }
  .btn-primary:hover { background: var(--blue-dark); color: #fff; }

  /* ---------- Gate screen ---------- */
  .gate {
    max-width: 420px;
    margin: 18vh auto 0;
    text-align: center;
    padding: 0 24px;
  }
  .gate h2 { font-size: 22px; font-weight: 500; margin-bottom: 10px; }
  .gate p { color: var(--ink-soft); font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
  #g_id_button_wrap { display: inline-block; }
  .gate-error {
    margin-top: 20px;
    font-size: 13px;
    color: var(--red);
    background: var(--red-bg);
    border-radius: 6px;
    padding: 10px 14px;
    display: none;
  }

  /* ---------- Controls ---------- */
  .controls {
    max-width: 1100px;
    margin: 24px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  select, input[type="text"] {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 4px;
    border: 1px solid var(--paper-line);
    background: #fff;
  }
  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .status-line {
    max-width: 1100px;
    margin: 8px auto 0;
    padding: 0 24px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  /* ---------- Cards ---------- */
  .board {
    max-width: 1100px;
    margin: 24px auto 60px;
    padding: 0 24px;
  }
  .week-heading {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-soft);
    margin: 32px 0 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--paper-line);
  }
  .week-heading:first-child { margin-top: 0; }
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  .note-card {
    background: #fff;
    border: 1px solid var(--paper-line);
    border-left: 4px solid var(--paper-line);
    border-radius: 8px;
    padding: 18px 20px;
  }
  .note-card.flagged { border-left-color: var(--red); }
  .note-card .who {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .note-card .who .name { font-size: 15px; font-weight: 500; }
  .note-card .who .date { font-size: 12px; color: var(--ink-soft); }
  .field { margin-bottom: 10px; }
  .field:last-child { margin-bottom: 0; }
  .field .label {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--blue);
    margin-bottom: 3px;
  }
  .field .value {
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--ink);
    white-space: pre-wrap;
  }
  .field .value.empty { color: #C0C3C6; font-style: italic; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    color: var(--red);
    background: var(--red-bg);
    padding: 2px 8px;
    border-radius: 20px;
    margin-left: 8px;
  }
  .empty-state {
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 60px 20px;
  }
</style>

<div id="app"></div>

<script>
(function () {
  const app = document.getElementById("app");
  let accessToken = null;
  let profile = null;
  let allRows = [];
  let colMap = {};

  // ---------- Render: sign-in gate ----------
  function renderGate(errorMsg) {
    app.innerHTML = `
      <div class="gate">
        <h2>AiMIND Lab 미팅 노트</h2>
        <p>학교 계정(@${CONFIG.ALLOWED_DOMAIN})으로 로그인하면<br>이번 주 랩 멤버들의 미팅 노트를 볼 수 있어요.</p>
        <div id="g_id_button_wrap"></div>
        <div class="gate-error" id="gateError">${errorMsg || ""}</div>
      </div>
    `;
    if (errorMsg) document.getElementById("gateError").style.display = "block";

    document.getElementById("g_id_button_wrap").innerHTML =
      `<button class="btn btn-primary" style="padding:10px 22px;font-size:14px;" onclick="window.__requestToken()">학교 계정으로 로그인</button>`;

    window.__tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.CLIENT_ID,
      scope: "https://www.googleapis.com/auth/spreadsheets.readonly https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile",
      callback: onToken
    });
    // Returning users skip the consent screen; show it again only if the Sheets box was left unchecked
    window.__requestToken = () => window.__tokenClient.requestAccessToken({
      prompt: needConsent ? "consent" : "",
      login_hint: (loadSession() || {}).email || localStorage.getItem(LAST_EMAIL_KEY) || ""
    });
  }

  // ---------- Session persistence (token lives ~1 hour) ----------
  const SESSION_KEY = "aimind_notes_session";
  const LAST_EMAIL_KEY = "aimind_notes_last_email";
  let needConsent = false;

  function loadSession() {
    try {
      const s = JSON.parse(localStorage.getItem(SESSION_KEY));
      return s && s.expiresAt > Date.now() + 60 * 1000 ? s : null;
    } catch (e) {
      return null;
    }
  }

  function clearSession() {
    localStorage.removeItem(SESSION_KEY);
  }

  window.__logout = () => {
    if (accessToken) google.accounts.oauth2.revoke(accessToken, () => {});
    clearSession();
    localStorage.removeItem(LAST_EMAIL_KEY);
    location.reload();
  };

  async function onToken(resp) {
    if (resp.error) {
      renderGate("로그인에 실패했어요. 다시 시도해주세요.");
      return;
    }
    if (!google.accounts.oauth2.hasGrantedAllScopes(resp, "https://www.googleapis.com/auth/spreadsheets.readonly")) {
      needConsent = true;
      renderGate("스프레드시트 보기 권한이 체크되지 않았어요. 다시 로그인할 때 권한 체크박스를 모두 체크해주세요.");
      return;
    }
    needConsent = false;
    const ok = await startSession(resp.access_token);
    if (ok) {
      localStorage.setItem(SESSION_KEY, JSON.stringify({
        token: resp.access_token,
        email: profile.email,
        expiresAt: Date.now() + Number(resp.expires_in || 3600) * 1000
      }));
      localStorage.setItem(LAST_EMAIL_KEY, profile.email);
    }
  }

  async function startSession(token) {
    accessToken = token;

    const userInfoRes = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
      headers: { Authorization: "Bearer " + accessToken }
    });
    if (!userInfoRes.ok) {
      clearSession();
      renderGate();
      return false;
    }
    profile = await userInfoRes.json();

    if (!profile.email || !profile.email.endsWith("@" + CONFIG.ALLOWED_DOMAIN)) {
      clearSession();
      renderGate(`이 대시보드는 @${CONFIG.ALLOWED_DOMAIN} 계정만 볼 수 있어요. (로그인한 계정: ${profile.email || "확인 불가"})`);
      return false;
    }

    renderApp();
    loadData();
    return true;
  }

  // ---------- Render: main app shell ----------
  function renderApp() {
    app.innerHTML = `
      <div class="topbar">
        <h1>📋 미팅 노트 대시보드</h1>
        <div class="user-box">
          <img src="${profile.picture || ""}" alt="">
          <span>${profile.name || profile.email}</span>
          <button class="btn" onclick="window.__logout()">로그아웃</button>
        </div>
      </div>
      <div class="controls">
        <select id="weekFilter"></select>
        <input type="text" id="searchBox" placeholder="이름 또는 이메일 검색">
        <label class="checkbox-label">
          <input type="checkbox" id="onlyFlagged">
          논의 필요만 보기
        </label>
        <button class="btn" id="refreshBtn">↻ 새로고침</button>
      </div>
      <div class="status-line" id="statusLine">불러오는 중…</div>
      <div class="board" id="board"></div>
    `;
    document.getElementById("weekFilter").addEventListener("change", renderBoard);
    document.getElementById("searchBox").addEventListener("input", renderBoard);
    document.getElementById("onlyFlagged").addEventListener("change", renderBoard);
    document.getElementById("refreshBtn").addEventListener("click", loadData);
  }

  // ---------- Data loading ----------
  async function loadData() {
    document.getElementById("statusLine").textContent = "불러오는 중…";
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SPREADSHEET_ID}/values/${encodeURIComponent(CONFIG.SHEET_RANGE)}`;
    try {
      const res = await fetch(url, { headers: { Authorization: "Bearer " + accessToken } });
      if (res.status === 401) {
        clearSession();
        renderGate("로그인이 만료됐어요. 다시 로그인해주세요.");
        return;
      }
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody?.error?.message || `HTTP ${res.status}`);
      }
      const data = await res.json();
      const rows = data.values || [];
      if (rows.length < 2) {
        document.getElementById("statusLine").textContent = "아직 제출된 응답이 없어요.";
        allRows = [];
        renderBoard();
        return;
      }
      const headers = rows[0];
      colMap = buildColMap(headers);
      allRows = rows.slice(1).map((r) => rowToEntry(r, headers.length));
      populateWeekFilter();
      document.getElementById("statusLine").textContent =
        `총 ${allRows.length}건 · 마지막 새로고침 ${new Date().toLocaleTimeString("ko-KR")}`;
      renderBoard();
    } catch (e) {
      document.getElementById("statusLine").textContent =
        "불러오기 실패: " + e.message + " (시트 공유 설정 또는 SPREADSHEET_ID를 확인해주세요)";
    }
  }

  function buildColMap(headers) {
    const idx = (keywords) =>
      headers.findIndex((h) => keywords.some((k) => (h || "").toLowerCase().includes(k.toLowerCase())));
    const map = {
      timestamp: idx(["타임스탬프", "timestamp"]),
      email: idx(["이메일"]),
      week: idx(["날짜"]),
      thisWeek: idx(["this week"]),
      problem: idx(["problem"]),
      nextWeek: idx(["next week"]),
      needDiscussion: idx(["need discussion"]),
      detail: -1
    };
    // Optional follow-up column for a 예/아니오-style Need discussion question
    // (skip columns already used, e.g. "Problem — 막힌 부분")
    const used = Object.values(map);
    map.detail = headers.findIndex((h, i) =>
      !used.includes(i) && ["어떤", "구체적", "detail", "논의 내용"].some((k) => (h || "").toLowerCase().includes(k)));
    // Key result has two possible columns: text + optional file upload
    let keyResultText = -1, keyResultFile = -1;
    headers.forEach((h, i) => {
      const low = (h || "").toLowerCase();
      if (low.includes("key result")) {
        if (low.includes("그림") || low.includes("파일") || low.includes("file")) keyResultFile = i;
        else keyResultText = i;
      }
    });
    map.keyResultText = keyResultText;
    map.keyResultFile = keyResultFile;
    return map;
  }

  function get(row, key) {
    const i = colMap[key];
    return i >= 0 && i < row.length ? (row[i] || "").trim() : "";
  }

  function rowToEntry(row, len) {
    while (row.length < len) row.push("");
    return {
      email: get(row, "email"),
      timestamp: get(row, "timestamp"),
      week: get(row, "week"),
      thisWeek: get(row, "thisWeek"),
      keyResultText: get(row, "keyResultText"),
      keyResultFile: get(row, "keyResultFile"),
      problem: get(row, "problem"),
      nextWeek: get(row, "nextWeek"),
      needDiscussion: get(row, "needDiscussion"),
      detail: get(row, "detail")
    };
  }

  function populateWeekFilter() {
    const weeks = Array.from(new Set(allRows.map((r) => r.week).filter(Boolean)));
    weeks.sort((a, b) => new Date(b) - new Date(a));
    const sel = document.getElementById("weekFilter");
    sel.innerHTML =
      `<option value="__all__">전체 주차</option>` +
      weeks.map((w) => `<option value="${w}">${w}</option>`).join("");
    if (weeks.length) sel.value = weeks[0];
  }

  function nameFromEmail(email) {
    if (!email) return "이름 없음";
    return email.split("@")[0];
  }

  function fieldBlock(label, value) {
    const safe = (value || "").replace(/</g, "&lt;");
    return `
      <div class="field">
        <div class="label">${label}</div>
        <div class="value ${safe ? "" : "empty"}">${safe || "작성 안 함"}</div>
      </div>`;
  }

  // Form uploads are Drive links; authuser makes Drive open them with the dashboard account
  // instead of the browser's default Google account (which may have no access)
  function fileLinks(value) {
    return value.split(",").map((s) => s.trim()).filter(Boolean).map((link, i, all) => {
      const id = (link.match(/[?&]id=([\w-]+)/) || link.match(/\/d\/([\w-]+)/) || [])[1];
      const href = id
        ? `https://drive.google.com/file/d/${id}/view?authuser=${encodeURIComponent(profile.email)}`
        : link;
      return `<a href="${href}" target="_blank" rel="noopener">첨부 파일 열기${all.length > 1 ? " " + (i + 1) : ""}</a>`;
    }).join(" · ");
  }

  // Need discussion may be free text or 예/아니오; anything other than a "no"-style answer counts
  function isFlagged(entry) {
    const v = entry.needDiscussion.trim();
    const noDiscussion =
      /^(아니|없|no\b|none|n\/a|x$|-+$|\.+$)/i.test(v) ||         // 아니오, 없음, 없습니다, no, -, ...
      /필요\s*(하지\s*않|없|x)|논의\s*(할\s*)?(사항|내용|것)?\s*(은|이)?\s*없/.test(v);  // 특별한 논의가 필요하지 않습니다, 논의 사항 없음
    return v !== "" && !noDiscussion;
  }

  function renderCard(entry) {
    const flagged = isFlagged(entry);
    const discussionText = entry.needDiscussion.trim() === "예" ? entry.detail : entry.needDiscussion;
    const keyResultBlock = entry.keyResultFile
      ? `<div class="field">
           <div class="label">Key result — 그림</div>
           <div class="value">${fileLinks(entry.keyResultFile)}</div>
         </div>`
      : "";
    return `
      <div class="note-card ${flagged ? "flagged" : ""}">
        <div class="who">
          <span class="name">${nameFromEmail(entry.email)}${flagged ? '<span class="badge">논의 필요</span>' : ""}</span>
          <span class="date">${entry.timestamp}</span>
        </div>
        ${fieldBlock("This week", entry.thisWeek)}
        ${fieldBlock("Key result", entry.keyResultText)}
        ${keyResultBlock}
        ${fieldBlock("Problem", entry.problem)}
        ${fieldBlock("Next week", entry.nextWeek)}
        ${flagged ? fieldBlock("Need discussion", discussionText) : ""}
      </div>`;
  }

  function renderBoard() {
    const board = document.getElementById("board");
    const weekFilter = document.getElementById("weekFilter")?.value || "__all__";
    const search = (document.getElementById("searchBox")?.value || "").toLowerCase();
    const onlyFlagged = document.getElementById("onlyFlagged")?.checked;

    let rows = allRows.filter((r) => {
      if (weekFilter !== "__all__" && r.week !== weekFilter) return false;
      if (search && !r.email.toLowerCase().includes(search)) return false;
      if (onlyFlagged && !isFlagged(r)) return false;
      return true;
    });

    if (!rows.length) {
      board.innerHTML = `<div class="empty-state">조건에 맞는 노트가 없어요.</div>`;
      return;
    }

    if (weekFilter !== "__all__") {
      board.innerHTML = `<div class="card-grid">${rows.map(renderCard).join("")}</div>`;
      return;
    }

    // group by week, most recent first
    const byWeek = {};
    rows.forEach((r) => {
      const w = r.week || "(주차 미기재)";
      (byWeek[w] = byWeek[w] || []).push(r);
    });
    const weeksSorted = Object.keys(byWeek).sort((a, b) => new Date(b) - new Date(a));
    board.innerHTML = weeksSorted
      .map(
        (w) => `
        <div class="week-heading">${w}</div>
        <div class="card-grid">${byWeek[w].map(renderCard).join("")}</div>
      `
      )
      .join("");
  }

  window.addEventListener("load", () => {
    renderGate();  // also sets up the token client, in case the saved token is rejected
    const saved = loadSession();
    if (saved) startSession(saved.token);
  });
})();
</script>

</body>
</html>
